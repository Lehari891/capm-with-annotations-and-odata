_schema-version: 3.3.0
ID: booksodatav4
description: A simple CAP project.
version: 1.0.0

modules:
  - name: booksodatav4-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: booksodatav4-db
      - name: uaa_booksodatav4
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: booksodatav4-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: booksodatav4-db
    parameters:
      buildpack: nodejs_buildpack

  - name: booksodatav4-destination-content
    type: com.sap.application.content
    requires:
      - name: booksodatav4-destination-service
        parameters:
          content-target: true

      - name: booksodatav4_html_repo_host
        parameters:
          service-key:
            name: booksodatav4_html_repo_host-key

      - name: uaa_booksodatav4
        parameters:
          service-key:
            name: uaa_booksodatav4-key

      - name: srv-api

    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:

            - Name: booksodatav4capm_booksodatav4_html_repo_host
              ServiceInstanceName: booksodatav4-html5-app-host-service
              ServiceKeyName: booksodatav4_html_repo_host-key
              sap.cloud.service: booksodatav4capm

            - Name: booksodatav4capm_uaa_booksodatav4
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: booksodatav4-xsuaa-service
              ServiceKeyName: uaa_booksodatav4-key
              sap.cloud.service: booksodatav4capm

            - Name: books-srv-api
              Authentication: NoAuthentication
              ProxyType: Internet
              Type: HTTP
              URL: ~{srv-api/srv-url}
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
              sap.cloud.service: booksodatav4capm

    build-parameters:
      no-source: true

  - name: booksodatav4-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: booksodatav4_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: bookscapmv4listreport
          artifacts:
            - bookscapmv4listreport.zip
          target-path: resources/

  - name: bookscapmv4listreport
    type: html5
    path: app/bookscapmv4listreport
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: booksodatav4-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: booksodatav4-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: booksodatav4-destination-service
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
        version: 1.0.0

  - name: booksodatav4_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: booksodatav4-html5-app-host-service

  - name: uaa_booksodatav4
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: booksodatav4-xsuaa-service
      path: ./xs-security.json

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production